<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeloAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="orange-box"></div>
            <div>
                <h2>XeloAI</h2>
                <p class="powered-by">powered by chunks ai</p>
            </div>
            <div class="status-dot" id="statusDot"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Witaj w XeloAI! Udało się pomyślnie skonfigurować stabilne połączenie. Zapytaj mnie o co tylko chcesz – na przykład o liczbę Pi!
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Zadaj pytanie..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        // Stabilny, otwarty dostawca modelu bez kluczy i bez blokad regionalnych
        const API_URL = "https://api.chunks.ai/v1/chat/completions";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (messageText === '') return;

            const chatBox = document.getElementById('chatBox');
            const statusDot = document.getElementById('statusDot');
            const sendBtn = document.getElementById('sendBtn');

            // 1. Wyświetlenie wiadomości użytkownika
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = messageText;
            chatBox.appendChild(userDiv);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Włączenie animacji ładowania
            statusDot.classList.add('typing');
            sendBtn.disabled = true;

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = "...";
            chatBox.appendChild(botDiv);

            try {
                // Wywołanie w 100% otwartego modelu
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "mistral-7b-instruct",
                        messages: [
                            { role: "system", content: "Jesteś asystentem o nazwie XeloAI. Odpowiadaj krótko, konkretnie i zawsze po polsku." },
                            { role: "user", content: messageText }
                        ]
                    })
                });

                const data = await response.json();
                
                // Wyciąganie czystego tekstu z uniwersalnego formatu OpenAI/Mistral
                if (data && data.choices && data.choices[0] && data.choices[0].message) {
                    botDiv.textContent = data.choices[0].message.content.trim();
                } else {
                    botDiv.textContent = "Serwer zwrócił nieznany format danych. Spróbuj ponownie.";
                }

            } catch (e) {
                console.error(e);
                botDiv.textContent = "Wystąpił problem z siecią. Upewnij się, że masz połączenie z internetem i spróbuj ponownie.";
            }

            // 3. Odblokowanie interfejsu
            statusDot.classList.remove('typing');
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
