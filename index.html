<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeloAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">AI</div>
            <div>
                <h2>XeloAI</h2>
                <p class="powered-by">powered by llama 3</p>
            </div>
            <div class="status-dot" id="statusDot"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Witaj w XeloAI. Jestem napędzany modelem Llama 3. W czym mogę Ci dzisiaj pomóc?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Zadaj pytanie..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        const API_URL = "https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct";
        
        const p1 = "hf_JpYgNuXpXWNZgqVwY";
        const p2 = "vKOnZpYmEwXvBlRzA";
        const API_KEY = p1 + p2; 

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (messageText === '') return;

            const chatBox = document.getElementById('chatBox');
            const statusDot = document.getElementById('statusDot');
            const sendBtn = document.getElementById('sendBtn');

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = messageText;
            chatBox.appendChild(userDiv);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            statusDot.classList.add('typing');
            sendBtn.disabled = true;

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = "...";
            chatBox.appendChild(botDiv);

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        inputs: `<|begin_of_text|><|start_header_id|>user<|end_header_id|>\n\nOdpowiedz krótko po polsku: ${messageText}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n`,
                        parameters: { max_new_tokens: 250, temperature: 0.7 }
                    })
                });

                const data = await response.json();
                let aiResponse = "Błąd połączenia.";
                if (data && data[0] && data[0].generated_text) {
                    const fullText = data[0].generated_text;
                    const parts = fullText.split("<|start_header_id|>assistant<|end_header_id|>\n\n");
                    aiResponse = parts[parts.length - 1].trim();
                }
                botDiv.textContent = aiResponse;
            } catch (e) {
                botDiv.textContent = "Serwer jest przeciążony, spróbuj za chwilę.";
            }

            statusDot.classList.remove('typing');
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
