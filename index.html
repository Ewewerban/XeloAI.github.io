<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeloAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="orange-box"></div>
            <div>
                <h2>XeloAI</h2>
                <p class="powered-by">powered by open ai engine</p>
            </div>
            <div class="status-dot" id="statusDot"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Witaj! Połączenie z prawdziwą siecią neuronową zostało pomyślnie skonfigurowane. Myślę w czasie rzeczywistym i odpowiem na każde Twoje pytanie. O co chcesz zapytać?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Zadaj dowolne pytanie..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        // Stabilny, publiczny i darmowy punkt dostępowy do prawdziwego AI bez blokad CORS dla stron WWW
        const API_URL = "https://open-ai-backend.lebyadyn.workers.dev/v1/chat/completions";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (messageText === '') return;

            const chatBox = document.getElementById('chatBox');
            const statusDot = document.getElementById('statusDot');
            const sendBtn = document.getElementById('sendBtn');

            // 1. Wyświetlenie wiadomości użytkownika
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = messageText;
            chatBox.appendChild(userDiv);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Włączenie animacji myślenia (status zacznie pulsować na pomarańczowo)
            statusDot.classList.add('typing');
            sendBtn.disabled = true;

            // Tworzymy dymek dla bota
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = "...";
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Wywołanie otwartego modelu sztucznej inteligencji
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [
                            { role: "system", content: "Jesteś asystentem AI o nazwie XeloAI, stworzonym dla ekosystemu XeloBrowser. Odpowiadasz krótko, zwięźle, konkretnie i zawsze w języku polskim. Masz unikalny czarno-pomarańczowy charakter." },
                            { role: "user", content: messageText }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                // Odczytywanie tekstu wygenerowanego przez AI
                if (data && data.choices && data.choices[0] && data.choices[0].message) {
                    botDiv.textContent = data.choices[0].message.content.trim();
                } else {
                    botDiv.textContent = "Serwer przesłał dane w nieprawidłowym formacie. Spróbuj zadać pytanie ponownie.";
                }

            } catch (e) {
                console.error(e);
                botDiv.textContent = "Nie udało mi się połączyć z siecią neuronową. Serwer jest chwilowo przeciążony, spróbuj ponownie za moment.";
            }

            // 3. Przywrócenie działania interfejsu
            statusDot.classList.remove('typing');
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
