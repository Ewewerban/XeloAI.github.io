<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XeloAI Workspace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #131314; /* Kolor tła Gemini */
      color: #e3e3e3;
      display: flex;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
    }

    /* PASEK BOCZNY (STABILNY) */
    .sidebar-browser {
      width: 280px;
      min-width: 280px;
      max-width: 280px;
      background-color: #1e1f20;
      border-right: 1px solid #3c4043;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34a853;
      border-radius: 50%;
      margin-left: auto;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      padding: 0 12px;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }

    .menu-button {
      background: none;
      border: none;
      padding: 14px 16px;
      color: #c4c7c5;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 100px; /* Okrągłe przyciski jak w Google */
      transition: background 0.2s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .menu-button:hover {
      background-color: #2d2f31;
      color: #fff;
    }

    .menu-button.active {
      color: #fff;
      background-color: #004a77; /* Delikatny niebieski akcent */
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 16px;
    }

    .clear-btn {
      background: none;
      color: #b3b3b3;
      border: 1px solid #444746;
      padding: 10px;
      width: 100%;
      border-radius: 100px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background-color: #372121;
      color: #ec928e;
      border-color: #ec928e;
    }

    /* GŁÓWNY OBSZAR ROBOCZY (BEZWZGLĘDNIE ZABLOKOWANY PRZED ROZJEŻDŻANIEM) */
    .main-content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      position: relative;
      background-color: #131314;
    }

    .viewport-content {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      overflow: hidden; /* Blokada nadrzędna */
    }

    .viewport-content.active {
      display: flex;
    }

    /* KONTENER CZATU */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      width: 100%;
    }

    /* SEKCJA WIADOMOŚCI - NIEZALEŻNY SCROLL */
    .chat-messages {
      flex: 1;
      padding: 24px 40px;
      overflow-y: auto; /* Scroll pojawia się tylko tutaj */
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    /* STYLIZACJA WIADOMOŚCI INSPiROWANA GEMINI */
    .message {
      max-width: 85%;
      padding: 12px 0; /* Wygląd czatu liniowego bez sztywnych bąbli */
      font-size: 16px;
      line-height: 1.6;
      word-wrap: break-word;
      display: flex;
      flex-direction: column;
    }

    .message::before {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #aa9c9c;
    }

    .message.user {
      align-self: flex-start;
      color: #fff;
      background-color: #2a2b2d;
      padding: 14px 20px;
      border-radius: 18px;
    }

    .message.ai {
      align-self: flex-start;
      color: #e3e3e3;
      width: 100%;
      max-width: 100%;
      border-top: 1px solid #28292a;
      padding-top: 20px;
    }

    .message.ai::before {
      content: "✨ XeloAI";
      color: #74a0ff;
    }

    .ai-generated-image {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 14px;
      border: 1px solid #444746;
    }

    /* STABILNY I ELASTYCZNY PANEL DOLNY */
    .chat-input-area {
      padding: 10px 40px 24px 40px;
      background-color: #131314;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      background-color: #1e1f20;
      border-radius: 28px;
      padding: 8px 16px 8px 24px;
      max-width: 850px;
      margin: 0 auto;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: #4f5154;
      background-color: #282a2c;
    }

    /* TEXTAREA ZAMIAST INPUTA - OBSŁUGA SHIFT+ENTER */
    .chat-input-area textarea {
      flex: 1;
      background: none;
      border: none;
      resize: none;
      max-height: 180px; /* Maksymalna wysokość pola */
      height: 24px;      /* Początkowa wysokość */
      padding: 4px 0;
      color: #e3e3e3;
      font-size: 16px;
      line-height: 24px;
      outline: none;
      font-family: inherit;
    }

    .chat-input-area button {
      background: none;
      border: none;
      color: #74a0ff;
      cursor: pointer;
      padding: 4px 8px;
      font-weight: 600;
      font-size: 15px;
      height: 32px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .chat-input-area button:disabled {
      color: #444746;
      cursor: not-allowed;
    }

    /* MODUŁY SYSTEMOWE */
    .modules-container {
      padding: 40px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
    }

    .modules-title {
      font-size: 24px;
      margin-bottom: 24px;
      color: #fff;
    }

    .equal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .equal-card {
      background-color: #1e1f20;
      border: 1px solid #3c4043;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .equal-card h3 {
      font-size: 18px;
      color: #fff;
    }

    .equal-card p {
      color: #c4c7c5;
      font-size: 14px;
      line-height: 1.6;
    }

    .status-badge {
      align-self: flex-start;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 100px;
      background-color: #004a77;
      color: #c2e7ff;
    }

    /* STYLE DLA FORMATOWANIA TEKSTU AI */
    .message.ai h1, .message.ai h2, .message.ai h3 { color: #fff; margin: 16px 0 8px 0; }
    .message.ai code { background-color: #2d2f31; padding: 2px 6px; border-radius: 6px; font-family: monospace; color: #ffb4ab; font-size: 14px; }
    .message.ai pre { background-color: #1e1f20; border: 1px solid #3c4043; padding: 16px; border-radius: 12px; margin: 12px 0; overflow-x: auto; }
    .message.ai pre code { background: none; padding: 0; color: #e3e3e3; }
    .message.ai p { margin-bottom: 8px; }
    .message.ai ul, .message.ai ol { margin-left: 24px; margin-bottom: 8px; }

    /* Paski przewijania (Scrollbars) */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #131314; }
    ::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #4f5154; }
  </style>
</head>

    <div class="sidebar-header">
      <span style="font-size: 22px;">⚙️</span>
      <div>
        <h2>XeloAI Workspace</h2>
      </div>
      <div class="status-dot"></div>
    </div>

      <button id="menu-modulesView" class="menu-button" onclick="switchView('modulesView', this)">📦 Moduły Systemu</button>
    </div>

    <div class="sidebar-footer">
      <button class="clear-btn" onclick="clearHistory()">🗑️ Wyczyść historię</button>

  </div>

            <button id="imageSendBtn" onclick="sendImageRequest()">Generuj</button>
          </div>
        </div>
      </div>
    </div>
