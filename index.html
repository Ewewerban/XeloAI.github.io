<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xelo AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo_xelo_ai.png">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-main">
                <img src="logo_xelo_ai.png" alt="Xelo AI Logo" class="logo">
                <div>
                    <h2>Xelo AI</h2>
                    <p class="powered-by">powered by xelo node server</p>
                </div>
            </div>
            <div class="status-dot" id="statusDot"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Witaj w Xelo AI! Bezpieczne i stabilne połączenie z serwerem zostało pomyślnie ustanowione. O co chcesz mnie zapytać?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Zadaj dowolne pytanie..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        // Twój unikalny i działający adres URL serwera na Val Town
        const MY_SERVER_URL = "https://ewewerbanEwewerban--60e9fcc8633011f1b4d31607ee4eb77e.web.val.run";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (messageText === '') return;

            const chatBox = document.getElementById('chatBox');
            const statusDot = document.getElementById('statusDot');
            const sendBtn = document.getElementById('sendBtn');

            // 1. Dodanie wiadomości użytkownika do okna czatu
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = messageText;
            chatBox.appendChild(userDiv);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Aktywacja wskaźnika myślenia bota i zablokowanie przycisku
            statusDot.classList.add('typing');
            sendBtn.disabled = true;

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = "...";
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Wysyłanie wiadomości jako czysty tekst bezpośrednio do serwera Val Town
                const response = await fetch(MY_SERVER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain; charset=utf-8"
                    },
                    body: messageText
                });

                const replyText = await response.text();
                
                // Wyświetlenie odpowiedzi zwróconej przez model AI
                botDiv.textContent = replyText;

            } catch (e) {
                console.error(e);
                botDiv.textContent = "Wystąpił błąd podczas próby komunikacji z serwerem. Upewnij się, że zmiany w Val Town zostały zapisane.";
            }

            // 3. Przywrócenie interfejsu do stanu gotowości
            statusDot.classList.remove('typing');
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
