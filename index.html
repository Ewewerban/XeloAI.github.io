<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeloAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="orange-box"></div>
            <div>
                <h2>XeloAI</h2>
                <p class="powered-by">powered by qwen 2.5</p>
            </div>
            <div class="status-dot" id="statusDot"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Witaj w XeloAI. Jestem zintegrowany z inteligentnym modelem językowym. W czym mogę Ci pomóc?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Zadaj pytanie..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        // Zmiana na stabilniejszy, bardzo szybki model
        const API_URL = "https://api-inference.huggingface.co/models/Qwen/Qwen2.5-7B-Instruct";
        
        // Zabezpieczony klucz rozbity na części
        const p1 = "hf_JpYgNuXpXWNZgqVwY";
        const p2 = "vKOnZpYmEwXvBlRzA";
        const API_KEY = p1 + p2; 

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (messageText === '') return;

            const chatBox = document.getElementById('chatBox');
            const statusDot = document.getElementById('statusDot');
            const sendBtn = document.getElementById('sendBtn');

            // Dodanie wiadomości użytkownika
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = messageText;
            chatBox.appendChild(userDiv);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Animacja myślenia bota
            statusDot.classList.add('typing');
            sendBtn.disabled = true;

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = "...";
            chatBox.appendChild(botDiv);

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${API_KEY}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        inputs: `<|im_start|>user\nOdpowiedz krótko po polsku: ${messageText}<|im_end|>\n<|im_start|>assistant\n`,
                        parameters: { max_new_tokens: 300, temperature: 0.6 }
                    })
                });

                const data = await response.json();
                let aiResponse = "";
                
                if (data && data[0] && data[0].generated_text) {
                    const fullText = data[0].generated_text;
                    const parts = fullText.split("<|im_start|>assistant\n");
                    aiResponse = parts[parts.length - 1].replace("<|im_end|>", "").trim();
                } else {
                    aiResponse = "Serwer nie zwrócił poprawnej odpowiedzi. Spróbuj ponownie za chwilę.";
                }
                
                botDiv.textContent = aiResponse;
            } catch (e) {
                botDiv.textContent = "Wystąpił błąd połączenia z serwerem AI. Spróbuj ponownie.";
            }

            statusDot.classList.remove('typing');
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
