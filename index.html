<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeloAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">AI</div>
            <div>
                <h2>XeloChat AI</h2>
                <p class="status" id="statusLabel">Online</p>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Cześć! Jestem prawdziwym modelem AI. Możesz zapytać mnie o matematykę, poprosić o napisanie wiersza lub zadać dowolne pytanie. W czym mogę pomóc?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Napisz coś do AI..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        // Używamy darmowego, otwartego modelu AI (Llama-3), który świetnie radzi sobie z różnymi pytaniami
        const API_URL = "https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct";
        
        // Publiczny token darmowy do odpytywania modelu
        const API_KEY = "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"; 

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            
            if (messageText === '') return;

            const chatBox = document.getElementById('chatBox');
            const statusLabel = document.getElementById('statusLabel');
            const sendBtn = document.getElementById('sendBtn');

            // 1. Dodaj wiadomość użytkownika do czatu
            const userMessageDiv = document.createElement('div');
            userMessageDiv.className = 'message user-message';
            userMessageDiv.textContent = messageText;
            chatBox.appendChild(userMessageDiv);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Zmiana statusu na "Pisze..."
            statusLabel.textContent = "AI pisze...";
            statusLabel.style.color = "#eab308"; // żółty kolor
            sendBtn.disabled = true;

            // 2. Stworzenie elementu na odpowiedź bota (z animacją czekania)
            const botMessageDiv = document.createElement('div');
            botMessageDiv.className = 'message bot-message';
            botMessageDiv.textContent = "Thinking...";
            chatBox.appendChild(botMessageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Wywołanie prawdziwego modelu AI
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `<|begin_of_text|><|start_header_id|>user<|end_header_id|>\n\nOdpowiedz krótko i zwięźle po polsku: ${messageText}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n`,
                        parameters: {
                            max_new_tokens: 250,
                            temperature: 0.7
                        }
                    })
                });

                const data = await response.json();
                
                // Wyciąganie czystego tekstu odpowiedzi
                let aiResponse = "";
                if (data && data[0] && data[0].generated_text) {
                    const fullText = data[0].generated_text;
                    // Odcinamy prompt systemowy, żeby pokazać tylko czystą odpowiedź AI
                    const parts = fullText.split("<|start_header_id|>assistant<|end_header_id|>\n\n");
                    aiResponse = parts[parts.length - 1].trim();
                } else {
                    aiResponse = "Przepraszam, mam mały problem z przetworzeniem tego pytania. Spróbuj ponownie!";
                }

                botMessageDiv.textContent = aiResponse;

            } catch (error) {
                console.error(error);
                botMessageDiv.textContent = "Nie udało mi się połączyć z serwerem AI. Sprawdź połączenie z internetem.";
            }

            // Przywrócenie statusu Online
            statusLabel.textContent = "Online";
            statusLabel.style.color = "#22c55e"; // zielony kolor
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
