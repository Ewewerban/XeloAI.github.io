<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeloAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="orange-box"></div>
            <div>
                <h2>XeloAI</h2>
                <p class="powered-by">powered by duckduckgo ai</p>
            </div>
            <div class="status-dot" id="statusDot"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Witaj w XeloAI! Jestem połączony z darmowym, otwartym modelem sztucznej inteligencji. Zapytaj mnie o cokolwiek, na przykład o liczbę Pi!
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Zadaj pytanie..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        // Korzystamy z otwartego, darmowego API bez konieczności używania jakichkolwiek kluczy (API KEY)
        const API_URL = "https://nexra.aryahcr.cc/api/chat/gpt";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (messageText === '') return;

            const chatBox = document.getElementById('chatBox');
            const statusDot = document.getElementById('statusDot');
            const sendBtn = document.getElementById('sendBtn');

            // 1. Dodanie wiadomości użytkownika
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = messageText;
            chatBox.appendChild(userDiv);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Włączenie animacji myślenia bota
            statusDot.classList.add('typing');
            sendBtn.disabled = true;

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = "...";
            chatBox.appendChild(botDiv);

            try {
                // Wysyłamy zapytanie do publicznego tunelu AI
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: [
                            { role: "user", content: `Odpowiedz krótko, zwięźle i po polsku: ${messageText}` }
                        ],
                        stream: false
                    })
                });

                const data = await response.json();
                
                // Odczytujemy odpowiedź tekstową z serwera
                if (data && data.gpt) {
                    botDiv.textContent = data.gpt.trim();
                } else if (data && data.gptResponse) {
                    botDiv.textContent = data.gptResponse.trim();
                } else {
                    botDiv.textContent = "Otrzymałem puste dane z systemu. Spróbuj zadać pytanie jeszcze raz.";
                }

            } catch (e) {
                console.error(e);
                botDiv.textContent = "Nie udało mi się pobrać odpowiedzi. Serwer AI może być chwilowo zajęty.";
            }

            // 3. Wyłączenie animacji i odblokowanie przycisku
            statusDot.classList.remove('typing');
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
