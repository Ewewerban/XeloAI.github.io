<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XeloAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #000000; color: #f0f3f5; display: flex; height: 100vh; overflow: hidden; }
    .sidebar-browser { width: 280px; background-color: #0d1117; border-right: 1px solid #21262d; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; background-color: #161b22; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 12px; }
    .sidebar-header h2 { font-size: 18px; color: #ffffff; }
    .status-dot { width: 8px; height: 8px; background-color: #2ea44f; border-radius: 50%; margin-left: auto; }
    .sidebar-menu { display: flex; flex-direction: column; padding: 12px; gap: 6px; flex: 1; }
    .menu-button { background: none; border: none; padding: 12px 16px; color: #8b949e; font-size: 14px; cursor: pointer; border-radius: 6px; text-align: left; width: 100%; }
    .menu-button:hover { background-color: #1f242c; color: #c9d1d9; }
    .menu-button.active { color: #ffffff; background-color: #1f242c; border-left: 3px solid #f7781e; font-weight: 600; }
    .sidebar-footer { padding: 12px; border-top: 1px solid #21262d; }
    .clear-btn { background-color: #21262d; color: #ff7b72; border: 1px solid #30363d; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .clear-btn:hover { background-color: #8c2323; color: white; }
    .main-content-area { flex: 1; display: flex; flex-direction: column; background-color: #000000; height: 100%; overflow: hidden; }
    .viewport-content { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
    .viewport-content.active { display: flex; }
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .chat-messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 75%; padding: 16px 20px; border-radius: 12px; font-size: 15px; line-height: 1.6; }
    .message.ai { background-color: #0d1117; color: #e6edf3; align-self: flex-start; border: 1px solid #21262d; }
    .message.user { background-color: #f7781e; color: #ffffff; align-self: flex-end; }
    .ai-generated-image { max-width: 100%; max-height: 400px; border-radius: 8px; margin-top: 10px; border: 1px solid #30363d; display: block; }
    .chat-input-area { padding: 20px 30px; background-color: #161b22; border-top: 1px solid #21262d; }
    .input-wrapper { display: flex; gap: 12px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .chat-input-area textarea { flex: 1; background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 14px; color: #f0f3f5; font-size: 15px; outline: none; resize: none; height: 50px; }
    .chat-input-area button { background-color: #f7781e; color: white; border: none; border-radius: 8px; padding: 0 24px; font-weight: bold; cursor: pointer; height: 50px; }
    .chat-input-area button:disabled { background-color: #30363d; color: #8b949e; cursor: not-allowed; }
    .modules-container { padding: 40px; }
    .equal-grid { display: flex; gap: 20px; }
    .equal-card { background-color: #0d1117; border: 1px solid #21262d; padding: 20px; border-radius: 8px; flex: 1; }
  </style>
</head>
<body>

  <div class="sidebar-browser">
    <div class="sidebar-header">
      <span style="font-size: 22px;">⚙️</span>
      <div>
        <h2>XeloAI</h2>
        <span style="font-size: 11px; color: #8b949e;">Workspace v1.9</span>
      </div>
      <div class="status-dot"></div>
    </div>
    <div class="sidebar-menu">
      <button class="menu-button active" onclick="switchView('chatView', this)">🤖 Inteligentny Czat AI</button>
      <button class="menu-button" onclick="switchView('imageView', this)">🎨 Generator Obrazów AI</button>
      <button class="menu-button" onclick="switchView('modulesView', this)">📦 Moduły Systemu</button>
    </div>
    <div class="sidebar-footer">
      <button class="clear-btn" onclick="clearHistory()">🗑️ Wyczyść historię</button>
    </div>
  </div>

  <div class="main-content-area">
    <div id="chatView" class="viewport-content active">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages"><div class="message ai">Witaj w XeloAI! W czym mogę pomóc?</div></div>
        <div class="chat-input-area">
          <div class="input-wrapper">
            <textarea id="userInput" placeholder="Zadaj pytanie..."></textarea>
            <button onclick="sendMessage()">Wyślij</button>
          </div>
        </div>
      </div>
    </div>

    <div id="imageView" class="viewport-content">
      <div class="chat-container">
        <div class="chat-messages" id="imageChatMessages"><div class="message ai">Opisz obraz, który chcesz stworzyć...</div></div>
        <div class="chat-input-area">
          <div class="input-wrapper">
            <textarea id="imageInput" placeholder="Opisz obraz (np. kot pijący kawę)..."></textarea>
            <button id="imageSendBtn" onclick="sendImageRequest()">Generuj</button>
          </div>
        </div>
      </div>
    </div>

    <div id="modulesView" class="viewport-content">
      <div class="modules-container">
        <h2 style="margin-bottom:20px;">Moduły Systemu</h2>
        <div class="equal-grid">
          <div class="equal-card"><h3>🤖 Czat</h3><p>Aktywny (Gemini 2.5 Flash)</p></div>
          <div class="equal-card"><h3>🎨 Grafika</h3><p>Aktywny (Flux Engine)</p></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const serverUrl = 'https://ewewerbanEwewerban--60e9fcc8633011f1b4d31607ee4eb77e.web.val.run';

    function switchView(viewId, btn) {
      document.querySelectorAll('.viewport-content').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.menu-button').forEach(b => b.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');
    }

    function clearHistory() {
      localStorage.removeItem("xelo_chat_html");
      localStorage.removeItem("xelo_image_html");
      document.getElementById('chatMessages').innerHTML = '<div class="message ai">Witaj w XeloAI! W czym mogę pomóc?</div>';
      document.getElementById('imageChatMessages').innerHTML = '<div class="message ai">Opisz obraz, który chcesz stworzyć...</div>';
    }

    // Ładowanie historii przy starcie
    if(localStorage.getItem("xelo_chat_html")) document.getElementById('chatMessages').innerHTML = localStorage.getItem("xelo_chat_html");
    if(localStorage.getItem("xelo_image_html")) document.getElementById('imageChatMessages').innerHTML = localStorage.getItem("xelo_image_html");

    // WYSYŁANIE TEKSTU
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if(!text) return;

      const container = document.getElementById('chatMessages');
      container.innerHTML += `<div class="message user">${text}</div>`;
      input.value = '';

      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.textContent = 'Generowanie odpowiedzi...';
      container.appendChild(aiDiv);
      container.scrollTop = container.scrollHeight;

      try {
        const r = await fetch(serverUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'text', prompt: text })
        });
        aiDiv.textContent = await r.text();
        localStorage.setItem("xelo_chat_html", container.innerHTML);
      } catch(e) {
        aiDiv.textContent = 'Błąd połączenia.';
      }
      container.scrollTop = container.scrollHeight;
    }

    // GENEROWANIE OBRAZU — TU JEST PEŁNA NAPRAWA
    async function sendImageRequest() {
      const input = document.getElementById('imageInput');
      const promptText = input.value.trim();
      if(!promptText) return;

      const container = document.getElementById('imageChatMessages');
      const btn = document.getElementById('imageSendBtn');

      container.innerHTML += `<div class="message user">${promptText}</div>`;
      input.value = '';
      btn.disabled = true;

      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.textContent = 'Trwa projektowanie grafiki przez AI...';
      container.appendChild(aiDiv);
      container.scrollTop = container.scrollHeight;

      try {
        const r = await fetch(serverUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'image', prompt: promptText })
        });
        
        const imageUrl = await r.text();
        
        // Wstrzykujemy czysty znacznik img z pobranym adresem URL obrazka
        aiDiv.innerHTML = `<div>Oto Twój obraz:</div><img class="ai-generated-image" src="${imageUrl.trim()}" alt="AI Image">`;
        localStorage.setItem("xelo_image_html", container.innerHTML);
      } catch(e) {
        aiDiv.textContent = 'Nie udało się wygenerować grafiki.';
      } finally {
        btn.disabled = false;
        container.scrollTop = container.scrollHeight;
      }
    }
  </script>
</body>
</html>
