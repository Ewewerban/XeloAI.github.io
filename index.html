<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XeloAI Browser Ecosystem</title>
  <style>
    /* Reset i podstawowe style nowoczesnego Dark Mode */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000000;
      color: #f0f3f5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* LEWY PASEK BOCZNY (SIDEBAR) - TERAZ JAKO NAWIGACJA PRZEGLĄDARKI */
    .sidebar-browser {
      width: 280px; /* Zwężony pasek boczny dla menu */
      background-color: #0d1117;
      border-right: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }

    .sidebar-header {
      padding: 16px;
      background-color: #161b22;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #2ea44f;
      border-radius: 50%;
      margin-left: auto;
    }

    /* Menu zakładek w sidebarze */
    .sidebar-menu {
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 6px;
    }

    .menu-button {
      background: none;
      border: none;
      padding: 12px 16px;
      color: #8b949e;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-button:hover {
      color: #c9d1d9;
      background-color: #1f242c;
    }

    .menu-button.active {
      color: #ffffff;
      background-color: #1f242c;
      border-left: 3px solid #f7781e;
      font-weight: 600;
    }

    .menu-button .badge {
      font-size: 10px;
      background-color: #30363d;
      color: #f7781e;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: auto;
      font-weight: bold;
    }

    /* GŁÓWNY OBSZAR (DUŻE POLE) - TERAZ TUTAJ JEST CZAT I PRZEGLĄDARKA */
    .main-content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000000;
    }

    /* Wirtualny pasek adresu na górze */
    .browser-navbar {
      background-color: #161b22;
      padding: 12px 20px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .browser-controls {
      display: flex;
      gap: 12px;
      color: #8b949e;
      font-size: 14px;
    }

    .browser-controls span {
      cursor: pointer;
      user-select: none;
    }

    .browser-search-bar {
      flex: 1;
      background-color: #0d1117;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13.5px;
      color: #8b949e;
      border: 1px solid #21262d;
    }

    /* KONTENERY NA ZAWARTOŚĆ W DUŻYM POLU */
    .viewport-content {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .viewport-content.active {
      display: flex;
    }

    /* WIDOK 1: POTĘŻNY, DUŻY CZAT Z AI */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #000000;
    }

    .chat-messages {
      flex: 1;
      padding: 30px; /* Większy padding dla dużego ekranu */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Dopasowanie szerokości wiadomości na dużym ekranie */
    .message {
      max-width: 75%;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 15.5px;
      line-height: 1.6;
    }

    .message.ai {
      background-color: #0d1117;
      color: #e6edf3;
      align-self: flex-start;
      border: 1px solid #21262d;
    }

    .message.user {
      background-color: #f7781e;
      color: #ffffff;
      align-self: flex-end;
    }

    /* Dolny pasek wpisywania rozciągnięty na całą szerokość dużego pola */
    .chat-input-area {
      padding: 20px 30px;
      background-color: #161b22;
      border-top: 1px solid #21262d;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      max-width: 1200px; /* Ograniczenie szerokości paska wpisywania dla wygody oka */
      margin: 0 auto;
      width: 100%;
    }

    .chat-input-area input {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 18px;
      color: #f0f3f5;
      font-size: 15px;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: #f7781e;
    }

    .chat-input-area button {
      background-color: #f7781e;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .chat-input-area button:hover {
      background-color: #e06510;
    }

    /* WIDOK 2: DUŻY KREATOR OBRAZÓW */
    .image-gen-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .image-gen-viewport h3 {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .image-gen-viewport p {
      color: #8b949e;
      max-width: 460px;
      font-size: 16px;
      line-height: 1.6;
    }

    @media (max-width: 800px) {
      body {
        flex-direction: column;
      }
      .sidebar-browser {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #21262d;
      }
      .sidebar-menu {
        flex-direction: row;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar-browser">
    <div class="sidebar-header">
      <span style="font-size: 22px;">⚙️</span>
      <div>
        <h2>XeloBrowser</h2>
        <span style="font-size: 11px; color: #8b949e; display: block;">v2.0 Ecosystem</span>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="sidebar-menu">
      <button class="menu-button active" onclick="switchView('chatView', this)">🤖 Inteligentny Czat AI</button>
      <button class="menu-button" onclick="switchView('imageView', this)">🎨 Generator Obrazów <span class="badge">niedługo</span></button>
    </div>
  </div>

  <div class="main-content-area">
    
    <div class="browser-navbar">
      <div class="browser-controls">
        <span>◀</span>
        <span>▶</span>
        <span style="font-size: 16px; margin-top: -1px;">↻</span>
      </div>
      <div class="browser-search-bar" id="browserUrl">https://xelobrowser.ecosystem/chat-ai</div>
    </div>
    
    <div id="chatView" class="viewport-content active">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="message ai">
            Witaj w pełnoekranowym panelu Xelo AI! Bezpieczna architektura tekstowa została pomyślnie zintegrowana z głównym oknem przeglądarki. Klucz API został poprawnie podłączony. W czym mogę Ci dzisiaj pomóc?
          </div>
        </div>

        <div class="chat-input-area">
          <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Zadaj pytanie sztucznej inteligencji na dużym ekranie..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Wyślij wiadomość</button>
          </div>
        </div>
      </div>
    </div>
