<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XeloAI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000000;
      color: #f0f3f5;
      display: flex;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
    }

    /* PASEK BOCZNY (STABILNY) */
    .sidebar-browser {
      width: 280px;
      min-width: 280px;
      max-width: 280px;
      background-color: #0d1117;
      border-right: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }

    .sidebar-header {
      padding: 16px;
      background-color: #161b22;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #2ea44f;
      border-radius: 50%;
      margin-left: auto;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }

    .menu-button {
      background: none;
      border: none;
      padding: 12px 16px;
      color: #8b949e;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .menu-button:hover {
      color: #c9d1d9;
      background-color: #1f242c;
    }

    .menu-button.active {
      color: #ffffff;
      background-color: #1f242c;
      border-left: 3px solid #f7781e;
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid #21262d;
      background-color: #161b22;
    }

    .clear-btn {
      background-color: #21262d;
      color: #ff7b72;
      border: 1px solid #30363d;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background-color: #8c2323;
      color: #ffffff;
      border-color: #ff7b72;
    }

    /* GŁÓWNY PANEL ROBOCZY */
    .main-content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000000;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      position: relative;
    }

    .viewport-content {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    .viewport-content.active {
      display: flex;
    }

    /* STRUKTURA CZATU */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
    }

    /* OKNO WIADOMOŚCI */
    .chat-messages {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 15.5px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .message.ai {
      background-color: #0d1117;
      color: #e6edf3;
      align-self: flex-start;
      border: 1px solid #21262d;
    }

    .message.user {
      background-color: #f7781e;
      color: #ffffff;
      align-self: flex-end;
    }

    .ai-generated-image {
      max-width: 100%;
      max-height: 450px;
      border-radius: 8px;
      margin-top: 12px;
      border: 1px solid #30363d;
      display: block;
    }

    /* PANEL DOLNY */
    .chat-input-area {
      padding: 20px 30px;
      background-color: #161b22;
      border-top: 1px solid #21262d;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .chat-input-area textarea {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 18px;
      color: #f0f3f5;
      font-size: 15px;
      outline: none;
      resize: none;
      height: 50px;
      max-height: 160px;
      line-height: 1.4;
      font-family: inherit;
    }

    .chat-input-area textarea:focus {
      border-color: #f7781e;
    }

    .chat-input-area button {
      background-color: #f7781e;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      height: 50px;
      transition: background 0.2s;
    }

    .chat-input-area button:disabled {
      background-color: #30363d;
      color: #8b949e;
      cursor: not-allowed;
    }

    /* ANIMACJA PISANIA AI */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background-color: #f7781e;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    /* SYSTEM MODUŁÓW */
    .modules-container {
      padding: 40px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
    }

    .modules-title {
      font-size: 22px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .equal-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .equal-card {
      flex: 1;
      min-width: 280px;
      background-color: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .equal-card h3 {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .equal-card p {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .status-badge {
      align-self: flex-start;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: #30363d;
      color: #f7781e;
    }

    /* FORMATOWANIE MARKDOWN */
    .message.ai h1, .message.ai h2, .message.ai h3 { color: #ffffff; margin-top: 12px; margin-bottom: 6px; font-weight: 600; }
    .message.ai code { background-color: #21262d; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #ff7b72; }
    .message.ai pre { background-color: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; margin: 10px 0; overflow-x: auto; }
    .message.ai pre code { background: none; padding: 0; color: #e6edf3; }
  </style>
</head>
<body>

  <div class="sidebar-browser">
    <div class="sidebar-header">
      <span style="font-size: 22px;">⚙️</span>
      <div>
        <h2>XeloAI</h2>
        <span style="font-size: 11px; color: #8b949e; display: block;">Workspace v1.6</span>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="sidebar-menu">
      <button id="menu-chatView" class="menu-button active" onclick="switchView('chatView', this)">🤖 Inteligentny Czat AI</button>

      <button id="menu-modulesView" class="menu-button" onclick="switchView('modulesView', this)">📦 Moduły Systemu</button>
    </div>

    <div class="sidebar-footer">
      <button class="clear-btn" onclick="clearHistory()">🗑️ Wyczyść historię</button>
    </div>
  </div>

          </div>
        </div>

            <textarea
